name: game_engine_palapa_web
description: >-
  The web implementation of game_engine_palapa: the same scenes and the same
  Dart API, rasterised by flutter_scene on WebGL2 instead of traced by Metal.
version: 0.1.0
repository: https://github.com/palapa-ai/game-engine-palapa
issue_tracker: https://github.com/palapa-ai/game-engine-palapa/issues
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_scene: ^0.23.0
  game_engine_palapa:
    git:
      url: https://github.com/palapa-ai/game-engine-palapa.git
      ref: web-backend
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Consumers resolve both packages from git, and pub will not reconcile a git
# dependency with a path into the same checkout. Working on the engine locally
# still wants the sibling.
dependency_overrides:
  game_engine_palapa:
    path: ../..

flutter:
  plugin:
    platforms:
      web:
        pluginClass: GameEngineWebPlugin
        fileName: src/game_engine_web_plugin.dart
