name: game_engine_palapa
description: >-
  A small real-time ray-traced game engine for Flutter: hardware ray tracing and
  MetalFX frame generation on Apple silicon, drawn into a Flutter texture.
version: 0.1.0
repository: https://github.com/palapa-ai/game-engine-palapa
issue_tracker: https://github.com/palapa-ai/game-engine-palapa/issues

topics:
  - game-engine
  - graphics
  - ray-tracing
  - metal

environment:
  sdk: ^3.12.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.2.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/castle.yaml
    - assets/fountain.yaml
    - assets/track.yaml
    - assets/playground.yaml
    - assets/cornell.yaml

  plugin:
    platforms:
      macos:
        pluginClass: GameEnginePlugin
